version: '3.8'
networks:
  test-task-net:
    name: test-task-net
    external: true
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: testtaskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5532:5432"
    networks:
      - test-task-net

  app:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://test-task-krainet-db-1:5432/testtaskdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
    networks:
      - test-task-net